# Local development profile. Activate with: -Dspring-boot.run.profiles=dev
# Do not use in production. Production uses env vars (SPRING_REDIS_HOST, etc.).

spring.redis.host=localhost
spring.redis.port=6379

# Relaxed rate limits for local development and E2E testing
app.rate-limit.room-creation.per-minute=50
app.rate-limit.room-creation.per-hour=200
app.rate-limit.room-creation.per-day=1000

# Relaxed room limits for local dev and testing
app.room-limit.max-active-per-session=20
