
# Application
spring.application.name=scrum-ceremonies
app.version=0.0.1-SNAPSHOT
server.servlet.session.cookie.http-only=true
# Secure cookie flag: set APP_HTTPS_ENABLED=true when TLS is terminated in front of the app.
server.servlet.session.cookie.secure=${APP_HTTPS_ENABLED:false}
server.servlet.session.cookie.same-site=lax
server.port=${PORT:8080}

# Request size limits — prevent abuse via large payloads
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
server.tomcat.max-http-form-post-size=2MB
server.tomcat.max-swallow-size=2MB

# Performance: Enable lazy initialization for faster startup
# Beans are created on-demand, not at startup
# Reduces cold start time from ~27s to <12s
spring.main.lazy-initialization=true

# Server timeout configurations for crawler compatibility
server.tomcat.connection-timeout=15000
server.tomcat.keep-alive-timeout=20000
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=10
# Forwarded headers: required when behind a reverse proxy or load balancer.
# Enables correct client IP resolution for rate limiting and session/room limits.
# Override via env: SERVER_FORWARD_HEADERS_STRATEGY, SPRING_MVC_FORWARDED_HEADERS_STRATEGY
server.forward-headers-strategy=framework
spring.mvc.forwarded-headers-strategy=framework

# Backend is API + WebSocket only; the frontend is static files served separately
# (any static host, or the same reverse proxy — see docs/LOCAL_DEV.md)
spring.web.resources.add-mappings=false
# Throw NoHandlerFoundException for unhandled paths so we return 404 (not 500)
spring.mvc.throw-exception-if-no-handler-found=true

# Redis
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.ssl=${SPRING_REDIS_SSL:false}
spring.redis.password=${SPRING_REDIS_PASSWORD:}

# RabbitMQ STOMP relay (optional — only needed when scaling to 2+ backend instances)
# Not used in local dev or single-instance deployments.
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.stomp.port=${SPRING_RABBITMQ_STOMP_PORT:61613}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.virtual-host=/
spring.rabbitmq.stomp.enabled=true
app.use.simple-broker=${APP_USE_SIMPLE_BROKER:true}
# Expected instance count — set >1 only after enabling RabbitMQ relay
app.expected-instances=${APP_EXPECTED_INSTANCES:1}

# Actuator - health checks and metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# The metrics scrape token. No default, deliberately: MetricsScrapeTokenFilter treats an
# empty value as DENY, so an unconfigured deployment serves no metrics rather than serving them to
# everyone. A default here would amount to a published shared credential — strictly worse than no
# filter, because it looks like a control while being none. Set METRICS_SCRAPE_TOKEN in the environment.
app.metrics.scrape-token=${METRICS_SCRAPE_TOKEN:}

management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:when-authorized}
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=true
management.health.defaults.enabled=true
management.endpoints.web.base-path=/actuator
# Liveness: JVM up = live (no dependency checks)
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-details=${HEALTH_SHOW_DETAILS:when-authorized}
# Readiness: checks Redis connectivity
management.endpoint.health.group.readiness.include=readinessState,redis
management.endpoint.health.group.readiness.show-details=${HEALTH_SHOW_DETAILS:when-authorized}
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.redis.timeout=2000
# Disable health indicators for optional services not running locally
management.health.rabbit.enabled=false
# Metrics configuration - read-only. /actuator/prometheus is gated by MetricsScrapeTokenFilter
# (METRICS_SCRAPE_TOKEN above); keep it off the public internet regardless.
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
# Disable sensitive endpoints (env, beans, configprops, etc.)
management.endpoints.web.exposure.exclude=env,beans,configprops,httptrace,threaddump,heapdump,loggers,auditevents

# CORS — REST and the WebSocket handshake.
# Defaults cover local development only: :3000 is the static frontend, :8080 the API.
# Deploying? Set APP_CORS_ALLOWED_ORIGINS to YOUR origin(s), comma-separated. This
# project ships no domain of its own, so there is nothing sensible to preload here.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}

# CSP connect-src. Defaults to local development; 'self' covers a same-origin deploy.
# Set APP_CSP_CONNECT_SRC when the API is on a different host than the pages.
app.csp.connect-src=${APP_CSP_CONNECT_SRC:self http://localhost:8080 ws://localhost:8080 wss://localhost:8080}

# Rate limiting
spring.redis.rate-limiter.enabled=true
spring.redis.rate-limiter.capacity=100
spring.redis.rate-limiter.refill-interval=60
spring.redis.rate-limiter.tokens=10

# Room Creation Rate Limiting (per IP)
# Max 5 room creations per minute per IP
app.rate-limit.room-creation.per-minute=5
# Max 20 room creations per hour per IP
app.rate-limit.room-creation.per-hour=20
# Max 100 room creations per day per IP
app.rate-limit.room-creation.per-day=100

# Room Limit (per session/user)
# Max 3 active rooms per session (room is active if lastActivity < 30 minutes)
app.room-limit.max-active-per-session=3

# Room User Limit
# Max 10 concurrent users per room (enforced atomically via Redis)
app.room.max-users=10

# User Presence TTL
# Time in seconds after which inactive users are removed (default: 60 seconds)
# Users are considered inactive if lastSeen > this threshold
app.room.user-ttl-seconds=60

# Cache Configuration
spring.cache.type=redis
spring.cache.cache-names=rooms,retroBoards,moodRooms,roomStates
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false

# Static resources: disabled (backend is API + WebSocket only)

# Usage Logging Configuration
# Enable/disable structured APP_USAGE log lines for a log aggregator (default: true)
app.usage.logging.enabled=true

# ── Graceful shutdown ─────────────────────────────────────────────────────────
# Boot's default is IMMEDIATE: on SIGTERM the container kills in-flight requests
# mid-execution. Graceful shutdown lets them drain first.
#
# The timeout must stay BELOW the platform's termination grace period, or the
# platform SIGKILLs mid-drain and this setting buys nothing. Most container
# platforms default to a 30s grace period, so 20s leaves headroom.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# OpenAPI documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.group-configs[0].group=v1-tools
springdoc.group-configs[0].paths-to-match=/api/**
springdoc.group-configs[0].display-name=v1 Free Tools (Anonymous)

