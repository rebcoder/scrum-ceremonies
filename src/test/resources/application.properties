# ==========================================================================
# Test application.properties
# Replaces main application.properties during tests.
# Contains the tool-tier properties only — this project has no database.
# ==========================================================================

# Application
spring.profiles.active=test
spring.application.name=scrum-ceremonies
app.version=0.0.1-SNAPSHOT

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.port=0

spring.main.lazy-initialization=true
server.tomcat.connection-timeout=15000
server.tomcat.keep-alive-timeout=20000
server.forward-headers-strategy=framework
spring.mvc.forwarded-headers-strategy=framework
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true

# Redis
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.ssl=false
spring.redis.password=

# RabbitMQ STOMP
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.stomp.port=61613
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
spring.rabbitmq.stomp.enabled=true
app.use.simple-broker=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=true
management.health.defaults.enabled=true
management.endpoints.web.base-path=/actuator
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.redis.timeout=2000
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.endpoints.web.exposure.exclude=env,beans,configprops,httptrace,threaddump,heapdump,loggers,auditevents

# CORS
app.cors.allowed-origins=http://localhost:8080,http://localhost,http://localhost:3000
app.csp.connect-src=self http://localhost:8080 ws://localhost:8080 wss://localhost:8080

# Rate limiting
spring.redis.rate-limiter.enabled=true
spring.redis.rate-limiter.capacity=100
spring.redis.rate-limiter.refill-interval=60
spring.redis.rate-limiter.tokens=10
app.rate-limit.room-creation.per-minute=5
app.rate-limit.room-creation.per-hour=20
app.rate-limit.room-creation.per-day=100

# Room limits
app.room-limit.max-active-per-session=3
app.room.max-users=10
app.room.user-ttl-seconds=60

# Cache
spring.cache.type=redis
spring.cache.cache-names=rooms,retroBoards,moodRooms,roomStates
spring.cache.redis.time-to-live=300000
spring.cache.redis.cache-null-values=false

# Usage logging
app.usage.logging.enabled=true
