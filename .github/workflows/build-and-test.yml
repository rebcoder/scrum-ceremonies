name: build-and-test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # SKIP_CACHE_TESTS=false arms the Testcontainers cache suites — the GH runner
      # has Docker, so they RUN here rather than silently skipping (see CONTRIBUTING.md).
      - name: Backend tests + coverage gate
        run: SKIP_CACHE_TESTS=false mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build (minify)
        run: cd frontend && npm ci && node scripts/build.js
      - name: Bundle size
        run: cd frontend && bash scripts/bundle-size-check.sh
      - name: Production smoke test
        run: bash frontend/scripts/production-smoke-test.sh

  e2e:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start backend (dev profile)
        run: |
          nohup mvn -q spring-boot:run -Dspring-boot.run.profiles=dev > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && exit 0
            sleep 2
          done
          echo "backend never became healthy"; tail -50 backend.log; exit 1
      - name: Local API config for the static pages
        run: |
          cat > frontend/v1/config.local.js <<'CFG'
          window.APP_CONFIG = {
            API_BASE_URL: 'http://localhost:8080',
            WS_BASE_URL: 'http://localhost:8080/ws'
          };
          CFG
      - name: Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
